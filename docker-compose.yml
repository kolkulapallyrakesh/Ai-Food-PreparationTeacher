services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cook
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cook"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+asyncpg://cook:${POSTGRES_PASSWORD}@db:5432/cook
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
